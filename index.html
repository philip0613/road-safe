<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도로 안전 통합 관제 & 보행자 경로 안내 대시보드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="header-container">
      <h1>도로 안전 통합 관제 & 보행자 경로 안내 대시보드</h1>
      <span class="status-indicator">● Gemini Vision AI 시스템 가동 중</span>
    </div>
  </header>

  <main class="dashboard-grid">
    <!-- 좌측 패널: Tmap 보행자 길찾기 및 정적 지도 -->
    <section class="panel left-panel">
      <div class="panel-header">
        <h2>보행자 안전 경로 안내</h2>
      </div>

      <form id="routeForm" class="control-form">
        <div class="input-row">
          <div class="input-group">
            <label for="startName">출발지 명칭</label>
            <input type="text" id="startName" value="서울역 1번출구" required>
          </div>
          <div class="input-group">
            <label for="endName">도착지 명칭</label>
            <input type="text" id="endName" value="남대문시장" required>
          </div>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="startLat">출발 위도 (Lat)</label>
            <input type="number" id="startLat" step="any" value="37.5547" required>
          </div>
          <div class="input-group">
            <label for="startLon">출발 경도 (Lon)</label>
            <input type="number" id="startLon" step="any" value="126.9706" required>
          </div>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="endLat">도착 위도 (Lat)</label>
            <input type="number" id="endLat" step="any" value="37.5592" required>
          </div>
          <div class="input-group">
            <label for="endLon">도착 경도 (Lon)</label>
            <input type="number" id="endLon" step="any" value="126.9776" required>
          </div>
        </div>

        <button type="submit" id="searchRouteBtn" class="btn btn-primary">보행자 안전 경로 탐색</button>
      </form>

      <div class="map-container">
        <div class="map-label">실시간 위치 지도 (출발지 기준)</div>
        <img id="staticMapImg" class="static-map" alt="Tmap 정적 지도" src="">
        <div id="mapLoader" class="loader-overlay" style="display: none;">지도 로딩 중...</div>
      </div>

      <div class="route-summary" id="routeSummary" style="display: none;">
        <div class="summary-metric">
          <span class="metric-title">총 이동 거리</span>
          <span class="metric-value" id="summaryDistance">-</span>
        </div>
        <div class="summary-metric">
          <span class="metric-title">예상 소요 시간</span>
          <span class="metric-value" id="summaryTime">-</span>
        </div>
      </div>

      <div class="route-steps-container">
        <h3>상세 이동 안내</h3>
        <ul id="routeStepsList" class="step-list">
          <li class="empty-state">경로 탐색 버튼을 누르면 상세 안내가 표시됩니다.</li>
        </ul>
      </div>
    </section>

    <!-- 우측 패널: 사진 기반 도로 안전 민원 접수 및 Gemini Vision 분석 -->
    <section class="panel right-panel">
      <div class="panel-header">
        <h2>현장 사진 기반 도로 안전 AI 정밀 분석</h2>
      </div>

      <form id="complaintForm" class="control-form">
        <div class="input-group">
          <label for="complaintImage">현장 사진 업로드 (필수)</label>
          <input type="file" id="complaintImage" accept="image/*" required>
        </div>

        <!-- 이미지 미리보기 영역 -->
        <div id="previewContainer" class="preview-box" style="display: none;">
          <img id="imagePreview" alt="업로드 이미지 미리보기">
          <button type="button" id="removeImgBtn" class="btn-remove">사진 제거</button>
        </div>

        <div class="input-group">
          <label for="complaintLocation">발생 위치</label>
          <input type="text" id="complaintLocation" placeholder="예: 시청역 4번 출구 앞 횡단보도" value="시청역 4번 출구 앞" required>
        </div>

        <div class="input-group">
          <label for="complaintNotes">추가 메모 (선택 사항)</label>
          <textarea id="complaintNotes" rows="2" placeholder="사진 외에 특이사항이 있다면 적어주세요."></textarea>
        </div>

        <button type="submit" id="submitComplaintBtn" class="btn btn-secondary">사진 AI 자동 분석 및 제보</button>
      </form>

      <div class="complaints-list-container">
        <div class="list-header">
          <h3>AI 분석 완료 민원 목록</h3>
          <span id="complaintCount" class="badge badge-count">0건</span>
        </div>
        <div id="complaintsList" class="cards-list">
          <div class="empty-state">도로 위험 현장 사진을 업로드하면 AI가 즉시 시각 판독을 수행합니다.</div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
