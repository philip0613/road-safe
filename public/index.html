<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SafeRoad - 도로 안전 통합 관제</title>

  <!-- Leaflet 지도 엔진 (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-viewport">
    <!-- 1. 전체 화면 지도 -->
    <div id="map"></div>

    <!-- 2. 상단 헤더 (SafeRoad 로고 & 포인트 배지) -->
    <header class="app-header">
      <div class="brand-badge">
        <span class="shield-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </span>
        <span class="brand-text">SafeRoad</span>
      </div>

      <div class="points-badge">
        <span class="coin-icon">🌕</span>
        <span id="userPoints" class="points-val">3,450 P</span>
      </div>
    </header>

    <!-- 3. 좌측 플로팅 필터 메뉴 -->
    <aside class="floating-filter-card">
      <div class="filter-header">
        <span class="pin-icon">📍</span> 지도 필터
      </div>
      <div class="filter-btn-group">
        <button type="button" class="filter-btn active" data-filter="all">
          <span class="dot dot-all"></span> 전체 보기
        </button>
        <button type="button" class="filter-btn" data-filter="danger">
          <span class="dot dot-danger"></span> 위험만 보기
        </button>
        <button type="button" class="filter-btn" data-filter="warning">
          <span class="dot dot-warning"></span> 주의 지역
        </button>
        <button type="button" class="filter-btn" data-filter="resolved">
          <span class="dot dot-resolved"></span> 해결된 곳
        </button>
        <button type="button" class="filter-btn" data-filter="my">
          <span class="icon-star">⭐</span> 내 제보
        </button>
      </div>
    </aside>

    <!-- 4. 우측 줌 & GPS 컨트롤 -->
    <div class="floating-controls">
      <div class="zoom-group">
        <button type="button" id="btnZoomIn" class="ctrl-btn" aria-label="확대">+</button>
        <button type="button" id="btnZoomOut" class="ctrl-btn" aria-label="축소">−</button>
      </div>
      <button type="button" id="btnGpsCenter" class="ctrl-btn gps-btn" aria-label="내 위치">
        <span class="target-icon">🎯</span>
      </button>
    </div>

    <!-- 5. TMAP 보행자 길찾기 패널 (접이식 바) -->
    <div class="route-trigger-bar" id="routeBar">
      <div class="route-bar-content" id="routeBarSummary">
        <span class="route-icon">🚶</span>
        <span class="route-text" id="routeBarText">보행자 안전 길찾기 경로 탐색</span>
      </div>
      <button type="button" id="btnOpenRouteModal" class="btn-sm-action">경로</button>
    </div>

    <!-- 6. 하단 네비게이션 탭바 (SafeRoad 정품 스타일) -->
    <nav class="bottom-tab-bar">
      <button type="button" class="tab-item active" data-tab="map">
        <span class="tab-icon">🗺️</span>
        <span class="tab-label">지도</span>
      </button>

      <button type="button" class="tab-item" data-tab="rank">
        <span class="tab-icon">🏆</span>
        <span class="tab-label">랭킹</span>
      </button>

      <!-- 중앙 돌출 FAB 제보 버튼 -->
      <div class="center-fab-wrapper">
        <button type="button" id="btnOpenReportSheet" class="fab-report-btn" aria-label="제보하기">
          <span class="fab-plus">+</span>
        </button>
        <span class="fab-label">제보하기</span>
      </div>

      <button type="button" class="tab-item" data-tab="store">
        <span class="tab-icon">🎁</span>
        <span class="tab-label">스토어</span>
      </button>

      <button type="button" class="tab-item" data-tab="settings">
        <span class="tab-icon">⚙️</span>
        <span class="tab-label">설정</span>
      </button>
    </nav>

    <!-- 7. [모달 1] 현장 사진 제보 & Gemini AI 분석 바텀시트 -->
    <div class="bottom-sheet-backdrop" id="reportSheetBackdrop">
      <div class="bottom-sheet" id="reportSheet">
        <div class="sheet-handle-bar"></div>
        <div class="sheet-header">
          <h3>현장 사진 기반 도로 안전 제보</h3>
          <button type="button" class="btn-sheet-close" id="btnCloseReportSheet">✕</button>
        </div>

        <form id="complaintForm" class="sheet-form" autocomplete="off">
          <div class="media-btn-row">
            <label for="cameraInput" class="btn-media-pill">
              📷 카메라 촬영
            </label>
            <label for="galleryInput" class="btn-media-pill">
              🖼️ 사진첩 선택
            </label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" class="visually-hidden">
            <input type="file" id="galleryInput" accept="image/*" class="visually-hidden">
          </div>

          <div id="previewContainer" class="image-preview-box" style="display: none;">
            <img id="imagePreview" alt="미리보기">
            <button type="button" id="removeImgBtn" class="btn-img-remove">✕</button>
          </div>

          <div class="form-field">
            <label for="complaintLocation">발생 위치 (지도 터치 시 자동 지정)</label>
            <input type="text" id="complaintLocation" placeholder="주소를 입력하거나 지도를 터치하세요" value="시청역 4번 출구 앞" required>
            <input type="hidden" id="complaintLat" value="37.5665">
            <input type="hidden" id="complaintLon" value="126.9780">
          </div>

          <div class="form-field">
            <label for="complaintNotes">추가 메모 (선택)</label>
            <textarea id="complaintNotes" rows="2" placeholder="도로 상태나 보행 위험 요소를 적어주세요."></textarea>
          </div>

          <button type="submit" id="submitComplaintBtn" class="btn-submit-report">
            Gemini AI 자동 판독 & 제보하기 (+100 P)
          </button>
        </form>
      </div>
    </div>

    <!-- 8. [모달 2] TMAP 보행자 길찾기 입력 모달 -->
    <div class="bottom-sheet-backdrop" id="routeModalBackdrop">
      <div class="bottom-sheet" id="routeModal">
        <div class="sheet-handle-bar"></div>
        <div class="sheet-header">
          <h3>보행자 안전 길찾기</h3>
          <button type="button" class="btn-sheet-close" id="btnCloseRouteModal">✕</button>
        </div>

        <form id="routeForm" class="sheet-form" autocomplete="off">
          <div class="form-field autocomplete-wrapper">
            <label for="startInput">출발지</label>
            <div class="input-with-btn">
              <input type="text" id="startInput" placeholder="출발 장소 입력" value="서울역 1번출구" required>
              <button type="button" id="btnGpsStart" class="btn-sub-action">📍내위치</button>
            </div>
            <ul id="startPoiList" class="poi-dropdown"></ul>
            <input type="hidden" id="startLat" value="37.5547">
            <input type="hidden" id="startLon" value="126.9706">
          </div>

          <div class="form-field autocomplete-wrapper">
            <label for="endInput">도착지</label>
            <input type="text" id="endInput" placeholder="도착 장소 입력" value="남대문시장" required>
            <ul id="endPoiList" class="poi-dropdown"></ul>
            <input type="hidden" id="endLat" value="37.5592">
            <input type="hidden" id="endLon" value="126.9776">
          </div>

          <button type="submit" id="searchRouteBtn" class="btn-submit-report">
            안전 경로 탐색
          </button>
        </form>
      </div>
    </div>

    <!-- 9. [모달 3] 랭킹/스토어/설정 서브 뷰 -->
    <div class="bottom-sheet-backdrop" id="subViewBackdrop">
      <div class="bottom-sheet" id="subViewSheet">
        <div class="sheet-handle-bar"></div>
        <div class="sheet-header">
          <h3 id="subViewTitle">랭킹</h3>
          <button type="button" class="btn-sheet-close" id="btnCloseSubView">✕</button>
        </div>
        <div class="sub-view-content" id="subViewContent"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
